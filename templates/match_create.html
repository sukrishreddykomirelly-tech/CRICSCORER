<!-- match_create.html -->
{% extends "base.html" %}

{% block title %}Create Match - CricScorer{% endblock %}

{% block content %}
<div class="premium-card" style="max-width: 800px; margin: 2rem auto;">
    <h2 class="card-title"><i class="fa-solid fa-circle-plus highlight"></i> Setup New Match</h2>
    
    <form action="{{ url_for('match_create') }}" id="match-creation-form" method="POST">
        
        <!-- Team Selection -->
        <div class="form-row">
            <div class="form-group">
                <label for="team1-select">Team 1 (Home)</label>
                <select id="team1-select" name="team1" class="form-control" required>
                    <option value="">Select Team 1...</option>
                    {% for t in teams %}
                        <option value="{{ t.id }}">{{ t.name }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="form-group">
                <label for="team2-select">Team 2 (Away)</label>
                <select id="team2-select" name="team2" class="form-control" required>
                    <option value="">Select Team 2...</option>
                    {% for t in teams %}
                        <option value="{{ t.id }}">{{ t.name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <!-- Format & Overs -->
        <div class="form-row">
            <div class="form-group">
                <label for="format">Match Format</label>
                <select id="format" name="format" class="form-control">
                    <option value="T20">T20 (20 Overs)</option>
                    <option value="T10">T10 (10 Overs)</option>
                    <option value="ODI">ODI (50 Overs)</option>
                    <option value="Custom">Custom / Recreational</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="overs_limit">Overs Limit per Innings</label>
                <input type="number" id="overs_limit" name="overs_limit" class="form-control" value="20" min="1" max="100" required>
            </div>
        </div>

        <!-- Special Playing Rules -->
        <div class="form-group" style="margin-top: 0.5rem; margin-bottom: 1.5rem;">
            <label class="squad-checkbox-item" style="display: inline-flex; align-items: center; gap: 0.5rem; cursor: pointer; font-weight: 500; font-size: 0.95rem; background: var(--bg-card); border: 1px solid var(--border-color); padding: 0.75rem 1rem; border-radius: var(--border-radius-sm);">
                <input type="checkbox" name="single_batting" id="single_batting" style="width: 1.1rem; height: 1.1rem; cursor: pointer; accent-color: var(--accent-emerald);">
                <span>Enable Single Batting (Last batsman can play alone)</span>
            </label>
        </div>

        <!-- Ground & Tournament -->
        <div class="form-row">
            <div class="form-group">
                <label for="ground">Ground Name</label>
                <input type="text" id="ground" name="ground" class="form-control" placeholder="e.g. Lords Ground" required>
            </div>
            
            <div class="form-group">
                <label for="tournament">Tournament (Optional)</label>
                <select id="tournament" name="tournament" class="form-control">
                    <option value="">Friendly Match (No Tournament)</option>
                    {% for tourney in tournaments %}
                        <option value="{{ tourney.id }}">{{ tourney.name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <!-- Date & Time -->
        <div class="form-row">
            <div class="form-group">
                <label for="match_date">Match Date</label>
                <input type="date" id="match_date" name="match_date" class="form-control" value="2026-08-25" required>
            </div>
            
            <div class="form-group">
                <label for="match_time">Start Time</label>
                <input type="time" id="match_time" name="match_time" class="form-control" value="10:00" required>
            </div>
        </div>

        <!-- Playing XI squad pickers (populated dynamically via JS) -->
        <div class="form-group" style="margin-top: 2rem;">
            <label style="margin-bottom:0.75rem;">Select Playing Squads (Playing XI)</label>
            <div class="squad-picker-grid">
                <div>
                    <h4 class="bold" style="font-size:0.9rem; color:var(--accent-emerald); margin-bottom:0.5rem;"><i class="fa-solid fa-circle-check"></i> Team 1 Roster</h4>
                    <div id="team1-squad-container" class="squad-selection-card">
                        <p class="muted">Select Team 1 to load players...</p>
                    </div>
                </div>
                <div>
                    <h4 class="bold" style="font-size:0.9rem; color:var(--accent-indigo); margin-bottom:0.5rem;"><i class="fa-solid fa-circle-check"></i> Team 2 Roster</h4>
                    <div id="team2-squad-container" class="squad-selection-card">
                        <p class="muted">Select Team 2 to load players...</p>
                    </div>
                </div>
            </div>
        </div>

        <div style="margin-top: 2rem; display:flex; gap:1rem;">
            <button type="submit" class="btn btn-primary" style="flex:1;"><i class="fa-solid fa-save"></i> Save &amp; Go to Toss</button>
            <a href="{{ url_for('index') }}" class="btn btn-outline" style="flex:1; text-align:center;">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
    // Autofill dates and dynamic format triggers
    const formatSelect = document.getElementById("format");
    const oversInput = document.getElementById("overs_limit");
    
    formatSelect.addEventListener("change", (e) => {
        const val = e.target.value;
        if (val === "T20") oversInput.value = 20;
        else if (val === "T10") oversInput.value = 10;
        else if (val === "ODI") oversInput.value = 50;
    });

    // Set today's date automatically
    const today = new Date().toISOString().split('T')[0];
    document.getElementById("match_date").value = today;

    // Prevent selecting the same team for both slots
    const form = document.getElementById("match-creation-form");
    const team1Select = document.getElementById("team1-select");
    const team2Select = document.getElementById("team2-select");
    
    if (form && team1Select && team2Select) {
        form.addEventListener("submit", (e) => {
            if (team1Select.value === team2Select.value && team1Select.value !== "") {
                e.preventDefault();
                alert("Team 1 and Team 2 cannot be the same team. Please select two different teams.");
            }
        });
    }
</script>
{% endblock %}
